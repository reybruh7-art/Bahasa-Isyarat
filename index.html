<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>BIRA: Sign Quest — Petualangan Isyarat</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  
  body, html {
    width: 100%;
    min-height: 100%;
    background: #eef7ee;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    color: #2e3d30;
    overflow-x: hidden;
    overflow-y: auto;
  }

  #app {
    display: flex;
    flex-direction: column;
    width: 100%;
    max-width: 480px;
    min-height: 100vh;
    margin: 0 auto;
    background: #ffffff;
    box-shadow: 0 0 20px rgba(0,0,0,0.06);
  }

  #header {
    position: sticky;
    top: 0;
    padding: 14px 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #2e7d32;
    color: #fff;
    font-weight: 800;
    font-size: 15px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    z-index: 30;
  }
  .star-badge { background: #1b5e20; padding: 5px 12px; border-radius: 20px; font-size: 13px; color: #ffeb3b; }

  #scene {
    background: linear-gradient(180deg, #d4edda 0%, #c3e6cb 65%, #a8d5ba 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px;
  }

  #speech-bubble {
    width: 100%;
    background: #ffffff;
    border-radius: 22px;
    padding: 18px 16px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.08);
    border: 2.5px solid #43a047;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    margin-bottom: 10px;
  }
  #bubble-npc-name { font-size: 12px; font-weight: 800; color: #2e7d32; letter-spacing: 0.5px; text-transform: uppercase; margin-bottom: 4px; }
  #bubble-text { font-size: 15px; font-weight: 700; color: #2b2b2b; margin-bottom: 12px; line-height: 1.4; }

  /* Kartu Ilustrasi Isyarat Utama */
  #sign-card {
    width: 145px;
    height: 145px;
    background: #f1f8e9;
    border-radius: 20px;
    border: 2px solid #81c784;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    margin-bottom: 10px;
    box-shadow: inset 0 2px 6px rgba(0,0,0,0.04);
    position: relative;
  }
  .sign-icon-large { font-size: 68px; line-height: 1; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.15)); }
  .body-indicator {
    position: absolute;
    bottom: 6px;
    background: #33691e;
    color: white;
    font-size: 10px;
    font-weight: 800;
    padding: 2px 8px;
    border-radius: 10px;
  }

  #bubble-meaning {
    font-size: 12px;
    color: #444;
    font-weight: 600;
    background: #e8f5e9;
    padding: 6px 14px;
    border-radius: 14px;
    border: 1px solid #c8e6c9;
  }

  #character-stage {
    width: 100px;
    height: 100px;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* Pilihan Respon */
  #dialog-panel {
    background: #ffffff;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding-bottom: 35px;
  }
  .prompt-label { font-size: 14px; font-weight: 800; color: #333; text-align: center; margin-bottom: 4px; }

  .choice-btn {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px 14px;
    background: #fafdfa;
    border: 2px solid #c8e6c9;
    border-radius: 18px;
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(0,0,0,0.04);
  }
  .choice-btn:active { background: #e8f5e9; border-color: #4caf50; transform: scale(0.98); }
  .choice-icon {
    width: 60px;
    height: 60px;
    background: #f1f8e9;
    border-radius: 15px;
    border: 1.5px solid #a5d6a7;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 34px;
    flex-shrink: 0;
  }
  .choice-text { flex: 1; }
  .choice-action { font-size: 14px; font-weight: 800; color: #2e7d32; display: block; margin-bottom: 3px; }
  .choice-desc { font-size: 12px; color: #666; line-height: 1.3; }

  /* Modal Hasil */
  #feedback-banner {
    position: fixed; inset: 0; background: rgba(0,0,0,0.65); backdrop-filter: blur(4px);
    display: none; justify-content: center; align-items: center; padding: 20px; z-index: 50;
  }
  .feedback-card {
    background: white; border-radius: 24px; padding: 24px 20px; text-align: center;
    max-width: 320px; width: 100%; box-shadow: 0 15px 30px rgba(0,0,0,0.25);
  }
  .feedback-card h3 { font-size: 20px; margin-bottom: 6px; }
  .feedback-icon { font-size: 52px; margin: 10px 0; }
  .feedback-card p { font-size: 14px; color: #555; margin-bottom: 16px; line-height: 1.4; }
  .feedback-btn {
    width: 100%; padding: 13px; border-radius: 16px; border: none; font-size: 15px;
    font-weight: 800; color: white; background: #2e7d32; cursor: pointer;
  }
</style>
</head>
<body>

<div id="app">
  <div id="header">
    <div>🌱 BIRA: SIGN QUEST</div>
    <div class="star-badge" id="star-count">⭐ 0 Bintang</div>
  </div>

  <div id="scene">
    <div id="speech-bubble">
      <div id="bubble-npc-name">Pak Bambu</div>
      <div id="bubble-text">"Selamat pagi! Senang bertemu denganmu."</div>
      
      <!-- Kartu Isyarat Jelas -->
      <div id="sign-card">
        <div id="sign-icon" class="sign-icon-large">👋</div>
        <div id="body-pos" class="body-indicator">Posisi: Di Depan Wajah</div>
      </div>
      
      <div id="bubble-meaning">Gerakan: Melambaikan tangan terbuka (Halo)</div>
    </div>

    <div id="character-stage">
      <svg id="npc-avatar-svg" width="90" height="90" viewBox="0 0 120 120"></svg>
    </div>
  </div>

  <div id="dialog-panel">
    <div class="prompt-label">Pilih respon isyarat tangan yang tepat:</div>
    <div id="options-container"></div>
  </div>
</div>

<div id="feedback-banner">
  <div class="feedback-card">
    <h3 id="feedback-title">Tepat Sekali! 🌟</h3>
    <div id="feedback-icon" class="feedback-icon">👋</div>
    <p id="feedback-desc">Kamu membalas sapaan dengan benar.</p>
    <button class="feedback-btn" onclick="nextQuestion()">LANJUTKAN</button>
  </div>
</div>

<script>
// Data Bank Bahasa Isyarat Jelas & Terstandar
const signCatalog = {
  halo: {
    icon: "👋",
    body: "Depan Wajah",
    meaning: "Melambaikan 5 jari terbuka (Halo / Salam)"
  },
  maaf: {
    icon: "✊🔄",
    body: "Di Depan Dada",
    meaning: "Mengepalkan tangan memutar di dada (Minta Maaf)"
  },
  terimaKasih: {
    icon: "🫲➡️",
    body: "Dagu ke Depan",
    meaning: "Ujung jari menyentuh dagu lalu diarahkan maju (Terima Kasih)"
  },
  samaSama: {
    icon: "🤲",
    body: "Dua Tangan Terbuka",
    meaning: "Membuka kedua telapak tangan ke atas (Sama-sama / Lapang Dada)"
  },
  tolong: {
    icon: "🙏",
    body: "Depan Dada",
    meaning: "Menangkupkan kedua telapak tangan rapat (Meminta Tolong)"
  }
};

const questDialogs = [
  {
    npc: "Pak Bambu (Warga Desa)",
    speech: "Selamat pagi! Cuaca di lembah hari ini sangat cerah ya.",
    signKey: "halo",
    choices: [
      { key: "halo", action: "Balas Sapaan (Halo / Selamat Pagi)", desc: "Melambaikan 5 jari tangan terbuka dengan ramah", correct: true },
      { key: "maaf", action: "Kepalan Tangan Memutar (Maaf)", desc: "Menunjukkan rasa bersalah dan memohon maaf", correct: false }
    ],
    hint: "Saat disapa dengan ramah, balaslah dengan lambaian tangan terbuka (👋)."
  },
  {
    npc: "Kakek Ranting",
    speech: "Wah, terima kasih banyak ya Bira sudah membantuku memetik buah!",
    signKey: "terimaKasih",
    choices: [
      { key: "tolong", action: "Menangkupkan Dua Telapak (Tolong)", desc: "Meminta bantuan orang lain", correct: false },
      { key: "samaSama", action: "Kedua Telapak Terbuka (Sama-sama)", desc: "Menyambut ucapan terima kasih dengan ikhlas", correct: true }
    ],
    hint: "Buka kedua telapak tangan menghadap ke atas (🤲) sebagai tanda 'Sama-sama'."
  },
  {
    npc: "Bunga Melati (Teman Tuli)",
    speech: "Bira, keranjang buahku sangat berat... bisakah kamu membantuku?",
    signKey: "tolong",
    choices: [
      { key: "samaSama", action: "Dua Telapak Terbuka Siap Membantu", desc: "Menyatakan siap menolong dengan lapang dada", correct: true },
      { key: "maaf", action: "Kepalan Tangan di Dada (Maaf)", desc: "Menolak karena sedang sibuk", correct: false }
    ],
    hint: "Tunjukkan kedua tangan terbuka (🤲) untuk menyatakan kesiapanmu membantu teman."
  },
  {
    npc: "Kancil Kecil",
    speech: "Aduh, maafkan aku Bira! Aku tidak sengaja menyenggol bungamu.",
    signKey: "maaf",
    choices: [
      { key: "samaSama", action: "Telapak Tangan Terbuka Lembut (Tidak Apa-apa)", desc: "Memaafkan dan memberi tahu bahwa semuanya baik-baik saja", correct: true },
      { key: "tolong", action: "Menangkupkan Tangan (Tolong)", desc: "Meminta bantuan lain", correct: false }
    ],
    hint: "Tanda memaafkan dilakukan dengan senyuman dan kedua telapak tangan terbuka (🤲)."
  }
];

let currentIndex = 0;
let stars = 0;

function drawAvatar(idx) {
  const el = document.getElementById("npc-avatar-svg");
  if (idx === 0) {
    el.innerHTML = `
      <circle cx="60" cy="50" r="28" fill="#8bc34a" stroke="#558b2f" stroke-width="3"/>
      <ellipse cx="60" cy="94" rx="32" ry="20" fill="#689f38"/>
      <circle cx="50" cy="46" r="4" fill="#2e7d32"/><circle cx="70" cy="46" r="4" fill="#2e7d32"/>
      <path d="M52,58 Q60,66 68,58" fill="none" stroke="#2e7d32" stroke-width="3" stroke-linecap="round"/>
      <path d="M60,22 Q56,8 70,7" fill="none" stroke="#33691e" stroke-width="4"/>
    `;
  } else if (idx === 1) {
    el.innerHTML = `
      <circle cx="60" cy="48" r="26" fill="#a1887f" stroke="#5d4037" stroke-width="3"/>
      <ellipse cx="60" cy="92" rx="28" ry="22" fill="#8d6e63"/>
      <circle cx="52" cy="44" r="3" fill="#3e2723"/><circle cx="68" cy="44" r="3" fill="#3e2723"/>
      <path d="M52,58 Q60,64 68,58" fill="none" stroke="#3e2723" stroke-width="3"/>
      <path d="M42,20 L52,32 M78,18 L68,32" stroke="#4e342e" stroke-width="4" stroke-linecap="round"/>
    `;
  } else {
    el.innerHTML = `
      <circle cx="60" cy="48" r="26" fill="#fff59d" stroke="#fbc02d" stroke-width="3"/>
      <ellipse cx="60" cy="92" rx="30" ry="22" fill="#fff9c4"/>
      <circle cx="52" cy="44" r="4" fill="#e65100"/><circle cx="68" cy="44" r="4" fill="#e65100"/>
      <path d="M52,56 Q60,64 68,56" fill="none" stroke="#e65100" stroke-width="3" stroke-linecap="round"/>
      <circle cx="60" cy="18" r="9" fill="#ffb74d"/>
    `;
  }
}

function loadStep(idx) {
  const q = questDialogs[idx];
  const signInfo = signCatalog[q.signKey];

  document.getElementById("bubble-npc-name").innerText = q.npc;
  document.getElementById("bubble-text").innerText = `"${q.speech}"`;
  document.getElementById("sign-icon").innerText = signInfo.icon;
  document.getElementById("body-pos").innerText = `Posisi: ${signInfo.body}`;
  document.getElementById("bubble-meaning").innerText = `Gerakan: ${signInfo.meaning}`;
  drawAvatar(idx);

  const container = document.getElementById("options-container");
  container.innerHTML = "";

  q.choices.forEach(c => {
    const optSign = signCatalog[c.key];
    const btn = document.createElement("div");
    btn.className = "choice-btn";
    btn.innerHTML = `
      <div class="choice-icon">${optSign.icon}</div>
      <div class="choice-text">
        <span class="choice-action">${c.action}</span>
        <span class="choice-desc">${c.desc}</span>
      </div>
    `;
    btn.onclick = () => selectChoice(c.correct, q.hint, optSign.icon);
    container.appendChild(btn);
  });
}

function selectChoice(isCorrect, hint, icon) {
  if (navigator.vibrate) {
    navigator.vibrate(isCorrect ? [80, 50, 80] : 200);
  }

  const modal = document.getElementById("feedback-banner");
  const title = document.getElementById("feedback-title");
  const desc = document.getElementById("feedback-desc");
  const iconBox = document.getElementById("feedback-icon");

  iconBox.innerText = icon;

  if (isCorrect) {
    stars += 1;
    document.getElementById("star-count").innerText = `⭐ ${stars} Bintang`;
    title.innerText = "Tepat Sekali! 🌟";
    title.style.color = "#2e7d32";
    desc.innerText = "Pilihan isyarat tanganmu sangat pas dengan percakapan.";
  } else {
    title.innerText = "Coba Perhatikan Lagi 🤔";
    title.style.color = "#d84315";
    desc.innerText = hint;
  }

  modal.style.display = "flex";
}

function nextQuestion() {
  document.getElementById("feedback-banner").style.display = "none";
  currentIndex++;
  if (currentIndex < questDialogs.length) {
    loadStep(currentIndex);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  } else {
    alert(`🎉 Selamat! Kamu telah menyelesaikan petualangan dengan total ${stars} Bintang!`);
    currentIndex = 0;
    stars = 0;
    document.getElementById("star-count").innerText = `⭐ 0 Bintang`;
    loadStep(0);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
}

loadStep(0);
</script>
</body>
</html>
